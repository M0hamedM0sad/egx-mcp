name: EGX daily learning loop

# Cloud-hosted DAILY learning loop. Runs on GitHub's servers each EGX trading
# day (Sun–Thu), independent of any local machine. Each day it:
#   1. generates the day's briefing (records decide() verdicts + weekly picks)
#   2. grades all prior verdicts forward against realized prices            (A1)
#   3. validates the edge statistically — is it real or luck?              (A4)
#   4. runs the learning loop: proposes a data-driven, OOS-validated V8b BUY
#      threshold update — and, only when one is justified, opens a PR
#   5. prints the reliability scorecard into the run summary
#   6. commits the updated briefings + graded evidence + proposal back
#
# This is the SAFE form of "the model improves every day": it MEASURES and
# PROPOSES daily, but never changes its own behavior silently. A proposal only
# alters the decision layer when you MERGE the PR it opens — that merge is the
# human approval gate. With thin data the learning step reports "insufficient
# evidence" and opens nothing, by design.
#
# The heavier weekly walk-forward (OOS) and symbol-cache pruning live in
# egx-weekly-enhance.yml.
#
# Prerequisites:
#   - This repo (the folder containing pyproject.toml) pushed to GitHub.
#   - Settings → Actions → General → Workflow permissions → "Read and write".
#   - Settings → Actions → General → "Allow GitHub Actions to create and
#     approve pull requests" — required for the auto-PR step.
#   - Optional email: set repo secrets SMTP_USER / SMTP_PASS and the daily
#     briefing will email; without them it just writes files.

on:
  schedule:
    # 07:00 UTC ≈ 09:00 Cairo (UTC+2). Sun–Thu only (cron dow: 0=Sun … 4=Thu).
    - cron: "0 7 * * 0-4"
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write          # needed to commit the updated evidence back
  pull-requests: write     # needed for the auto-PR step to open the proposal PR

concurrency:
  group: egx-daily-learn
  cancel-in-progress: false  # never cancel mid-run; evidence must fully commit

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Grade BEFORE generating today's briefing: grading past verdicts only
      # needs prior briefings + realized prices, so a bad data day that kills
      # the briefing step must not also stall evidence accumulation.
      - name: Grade decisions against realized prices (A1)
        run: python -m tests.grade_briefings || echo "grading produced nothing yet"

      - name: Generate today's briefing (records decisions)
        # Fail closed: do not append or learn from a day whose decision
        # snapshots could not be generated from current source data.
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python -m scripts.daily_briefing

      - name: Statistical edge validation (A4) → run summary
        # Honest gate: is the measured edge real or luck? Exits non-zero unless
        # EDGE_CONFIRMED, so `|| true` keeps the loop running while still
        # surfacing the verdict in the summary and a committed artifact.
        run: |
          echo "## Statistical Edge Validation (A4)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m tests.validate_edge 2>&1 | tee logs/edge_validation_latest.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Learning loop — analyze & propose (no change applied)
        # Reads graded_verdicts.jsonl, fits a BUY threshold on the IS slice,
        # validates OOS. Writes logs/learning_proposal.json. Does NOT apply.
        run: |
          echo "## V8b Learning Loop — Threshold Proposal" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m scripts.learn 2>&1 | tee logs/learning_proposal_latest.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Reliability scorecard → run summary
        run: |
          echo "## Model Reliability Scorecard" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m scripts.reliability_status 2>&1 | tee logs/reliability_latest.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated evidence
        # always(): graded evidence from the step above must land even when
        # the briefing step failed closed on a bad data day.
        if: always()
        run: |
          git config user.name  "egx-learner[bot]"
          git config user.email "egx-learner@users.noreply.github.com"
          git add briefings logs 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new evidence to commit."
          else
            git commit -m "chore(evidence): daily briefing + graded verdicts + proposal [skip ci]"
            # Running the tools rewrites tracked runtime caches (price_cache.json,
            # investing_pairids.json, decisions.jsonl …). Whatever wasn't staged
            # above is disposable churn — drop it, or `pull --rebase` refuses with
            # "cannot pull with rebase: You have unstaged changes" and exits 128.
            git checkout -- .
            git pull --rebase origin main
            git push
          fi

      - name: Open PR for OOS-validated proposal
        # The proposal JSON is already on main (committed above as evidence).
        # Only when learn.py flagged status=="proposal" do we branch off main,
        # run `learn --apply` (writes model_params.json), and open a PR. The
        # decision layer changes behavior ONLY after this PR is merged —
        # merging is the human approval gate that `--apply` used to be.
        #
        # Branch name keys on the candidate threshold so daily re-runs reuse
        # the same PR instead of spamming new ones; a different candidate opens
        # a fresh PR. Skips silently if the PR/branch already exists.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PROP=logs/learning_proposal.json
          if [ ! -f "$PROP" ]; then echo "No proposal file — nothing to open."; exit 0; fi
          STATUS=$(jq -r '.status // "missing"' "$PROP")
          if [ "$STATUS" != "proposal" ]; then
            echo "No actionable proposal (status: $STATUS) — nothing to open."
            exit 0
          fi

          TAG=$(jq -r '.change_tag // "none"' "$PROP")
          BRANCH="auto-learn/${TAG}"

          # Idempotent: skip if a PR for this candidate is already open or the
          # branch already exists on the remote (e.g. previously opened/rejected).
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            echo "PR for $BRANCH already open — skipping."; exit 0
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists on remote — skipping."; exit 0
          fi

          git config user.name  "egx-learner[bot]"
          git config user.email "egx-learner@users.noreply.github.com"
          git checkout -b "$BRANCH"

          # Approved-path apply — writes model_params.json at the repo root.
          python -m scripts.learn --apply

          git add model_params.json
          if git diff --cached --quiet; then
            echo "learn --apply produced no diff — nothing to PR."; exit 0
          fi
          git commit -m "feat(model): apply OOS-validated update (${TAG})"
          git push -u origin "$BRANCH"

          # Title + body are precomputed by learn.py (handles threshold and/or
          # weight changes), so the workflow doesn't reconstruct them in jq.
          jq -r '.pr_body' "$PROP" > /tmp/pr_body.md
          gh pr create \
            --title "$(jq -r '.pr_title' "$PROP")" \
            --body-file /tmp/pr_body.md \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH"

      - name: Benchmark coverage guard
        # The learning loop only uses graded rows that carry excess_pct (return
        # vs benchmark). If the benchmark fetch silently fails, grading still
        # "succeeds" but every row is unusable and the loop starves on
        # "insufficient evidence" forever — exactly what happened before the
        # synthetic-basket fallback existed. Runs LAST so the day's evidence is
        # already committed either way; a failure here just turns the run red
        # (and emails the repo owner) instead of losing the briefing.
        if: always()
        run: |
          python - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          from pathlib import Path
          f = Path("logs/graded_verdicts.jsonl")
          rows = [json.loads(l) for l in f.read_text(encoding="utf-8").splitlines() if l.strip()] if f.exists() else []
          graded = [r for r in rows if r.get("outcome") == "graded"]
          with_exc = [r for r in graded if isinstance(r.get("excess_pct"), (int, float))]
          pct = 100.0 * len(with_exc) / len(graded) if graded else 0.0
          print(f"## Benchmark coverage: {len(with_exc)}/{len(graded)} graded rows have excess_pct ({pct:.0f}%)")
          if graded and pct < 80.0:
              print("FAIL: benchmark returns are missing on >20% of graded calls — "
                    "the learning loop cannot use them. Check the synthetic-basket "
                    "fetch (Yahoo rate limit / network) in tests/grade_briefings.py.")
              sys.exit(1)
          EOF
