name: Collect English headlines

# Read-only: gathers English EGX headlines (yfinance per stock + market
# scrapers) so they can be labeled for the sentiment eval. Commits nothing.

on:
  workflow_dispatch: {}
  push:
    paths:
      - scripts/collect_en_headlines.py
      - .github/workflows/collect-en-headlines.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Collect
        run: python -m scripts.collect_en_headlines
