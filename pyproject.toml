[project]
name = "egx-mcp"
version = "0.1.0"
description = "MCP server exposing live Egyptian Exchange (EGX) data, screening, news, and portfolio P&L"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Mohamed Mosad", email = "m0hamedm0sad@gmail.com" },
]
dependencies = [
    "mcp[cli]>=1.25,<2",
    "yfinance>=0.2.40",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pandas>=2.0",
    "numpy>=1.24",
    "lxml>=5.0",
]

[project.optional-dependencies]
# Transformer-backed sentiment (FinBERT EN + CAMeLBERT-DA AR) and zero-shot
# disclosure event tagging (multilingual NLI). Not required — the lexicon /
# keyword fallbacks are the zero-dependency defaults.
sentiment = [
    "transformers>=4.40",
    "torch>=2.0",
]
# Zero-shot price forecasting (Chronos / TimesFM) — forecast.py feature.
forecast = [
    "chronos-forecasting>=1.4",
    "torch>=2.0",
]
# Investor-relations document extraction — ir_extract.py (PDF text parsing).
ir = [
    "pypdf>=4.0",
]
# Fine-tuning a classifier on labeled EGX data — scripts/finetune_classifier.py.
train = [
    "transformers>=4.40",
    "torch>=2.0",
    "datasets>=2.18",
    "scikit-learn>=1.3",
]

[project.scripts]
egx-mcp = "egx_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["egx_mcp"]
