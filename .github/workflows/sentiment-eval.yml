name: Sentiment backend eval (lexicon vs CAMeL-BERT)

# Read-only: scores 382 labeled EGX Arabic headlines with the lexicon and the
# transformer backend (CAMeL-BERT DA for Arabic) and prints accuracy,
# macro-F1 and confusion. Commits nothing.

on:
  workflow_dispatch: {}
  push:
    paths:
      - tests/eval_sentiment.py
      - tests/egx_arabic_headlines_labeled.csv
      - tests/egx_english_headlines_labeled.csv
      - egx_mcp/data/egx_news_rules*.py
      - egx_mcp/data/transformer_sentiment.py
      - .github/workflows/sentiment-eval.yml

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . "transformers>=4.40"
      - name: Evaluate
        run: |
          set -o pipefail
          for f in egx_arabic_headlines_labeled egx_english_headlines_labeled; do
            python -m tests.eval_sentiment tests/$f.csv 2>&1 | tee eval_$f.txt
            {
              echo "## $f: lexicon vs EGX rules vs transformer"
              echo '```'
              grep -E 'Backend:|gold / pred|^ +(positive|negative|neutral) \||Transformer|# EGX' eval_$f.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
