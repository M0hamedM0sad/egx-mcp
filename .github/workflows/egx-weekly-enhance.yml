name: EGX weekly enhancement loop

# Runs every Sunday at 06:00 UTC (08:00 Cairo, before EGX opens).
# The HEAVY weekly checks; the daily learning loop (grade → propose → PR) lives
# in egx-daily-grade.yml. Two jobs in sequence:
#
#   1. oos-test    — walk-forward OOS test on the W1 weekly model for last
#                    week. Appends one row to logs/oos_weekly_log.jsonl so
#                    performance accumulates week-by-week. Also force-refreshes
#                    the EGX symbol cache (prune dead tickers / add listings).
#
#   2. summarise   — runs the MCP transport health check (validate_mcp_tools —
#                    a slow full sweep best run weekly), emits the reliability
#                    scorecard, prints the cumulative OOS log, and commits the
#                    new artifacts back so evidence compounds automatically.
#
# Prerequisites (one-time repo setup):
#   • Push the egx-mcp folder (containing pyproject.toml) to GitHub.
#   • Settings → Actions → General → Workflow permissions → "Read and write".
#   • Optional: add SMTP_USER / SMTP_PASS secrets if you also want the daily
#     briefing to email (used by egx-daily-grade, not this workflow).

on:
  schedule:
    - cron: "0 6 * * 0"   # 06:00 UTC every Sunday
  workflow_dispatch: {}    # allow "Run workflow" from the Actions tab

permissions:
  contents: write          # needed to commit evidence back to the repo

concurrency:
  group: egx-weekly-enhance
  cancel-in-progress: false  # never cancel mid-run; evidence must fully commit

jobs:

  # ── Job 1: W1 out-of-sample walk-forward ──────────────────────────────────
  oos-test:
    name: "W1 OOS walk-forward (last week)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Refresh EGX symbols cache
        # Force-refresh so dead tickers are pruned weekly and new listings
        # are picked up. Runs before the OOS test so the universe is current.
        run: |
          python - <<'EOF'
          import sys; sys.path.insert(0, ".")
          from egx_mcp.data import egx_listing
          r = egx_listing.validate_and_cache(force=True)
          print(f"Cache refreshed: {r['count']} live tickers, {len(r['dead'])} dead")
          EOF

      - name: OOS walk-forward — last week
        # Dates are computed dynamically inside the script; nothing to set here.
        # continue-on-error so a data hiccup never blocks the commit step.
        continue-on-error: true
        run: |
          mkdir -p logs
          python -m tests.oos_last_week 2>&1 | tee logs/oos_last_week_latest.txt

      - name: Write OOS results to step summary
        if: always()
        run: |
          echo "## W1 OOS Walk-Forward — Last Week" >> "$GITHUB_STEP_SUMMARY"
          if [ -f logs/oos_last_week_latest.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat logs/oos_last_week_latest.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_OOS test did not produce output._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit OOS artifacts
        run: |
          git config user.name  "egx-enhancer[bot]"
          git config user.email "egx-enhancer@users.noreply.github.com"
          git add logs/oos_weekly_log.jsonl \
                  logs/oos_last_week_latest.txt \
                  egx_mcp/data/egx_symbols_cache.json \
                  2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No OOS artifacts to commit."
          else
            git commit -m "chore(oos): weekly walk-forward result [skip ci]"
            # Drop unstaged runtime-cache churn written by the steps above; with
            # it present `pull --rebase` aborts on "unstaged changes" (exit 128).
            git checkout -- .
            git pull --rebase origin main
            git push
          fi

  # ── Job 2: Transport health + reliability scorecard ───────────────────────
  summarise:
    name: "Transport health + reliability scorecard"
    runs-on: ubuntu-latest
    needs: oos-test   # run after OOS so it sees the refreshed symbol cache

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: MCP transport health check (A0)
        # Slow full sweep (every registered tool) — weekly cadence fits it.
        # Non-fatal here so a flaky data source never blocks the scorecard;
        # the verdict and any contract violations land in the summary + artifact.
        continue-on-error: true
        run: |
          echo "## MCP Transport Health (A0)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m tests.validate_mcp_tools 2>&1 | tee logs/mcp_validation_latest.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Reliability scorecard
        continue-on-error: true
        run: |
          python -m scripts.reliability_status 2>&1 | tee logs/reliability_latest.txt

      - name: Write scorecard to step summary
        if: always()
        run: |
          echo "## Model Reliability Scorecard" >> "$GITHUB_STEP_SUMMARY"
          if [ -f logs/reliability_latest.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat logs/reliability_latest.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_Scorecard did not produce output._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show cumulative OOS log
        # Print the running week-by-week record so it's visible in the summary.
        run: |
          echo "## Cumulative W1 OOS Log" >> "$GITHUB_STEP_SUMMARY"
          if [ -f logs/oos_weekly_log.jsonl ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json; from pathlib import Path
          rows = [json.loads(l) for l in Path("logs/oos_weekly_log.jsonl").read_text().splitlines() if l.strip()]
          for r in rows:
              print(f"{r['cutoff']}  top5={r['top5_return_pct']:+.2f}%  "
                    f"basket={r['basket_return_pct']:+.2f}%  "
                    f"alpha={r['alpha_vs_basket']:+.2f}pp  "
                    f"ls_spread={r['ls_spread_pp']:+.2f}pp  "
                    f"mae={r['mc_mae_pp']:.2f}pp")
          print(f"\n{len(rows)} weeks logged.")
          EOF
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No OOS log yet._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit scorecard artifact
        run: |
          git config user.name  "egx-enhancer[bot]"
          git config user.email "egx-enhancer@users.noreply.github.com"
          git add logs/reliability_latest.txt logs/mcp_validation_latest.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No scorecard artifact to commit."
          else
            git commit -m "chore(score): reliability scorecard [skip ci]"
            # The A0 sweep exercises every tool, so it always leaves tracked
            # caches dirty — this is the step that has failed with exit 128 on
            # every weekly run. Discard that churn before rebasing.
            git checkout -- .
            git pull --rebase origin main
            git push
          fi

  # ── Job 3: Market-data panel → parameter proposal ─────────────────────────
  panel-learn:
    name: "Panel learning loop (market data)"
    runs-on: ubuntu-latest
    needs: oos-test          # serialise the pushes; both jobs commit to main

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Rebuild the market-data panel
        # Refetches ~250 names of daily history from investing.com and
        # reconstructs point-in-time scores + forward 21-session excess at every
        # weekly rebalance date. Slow (network-bound) — hence weekly, not daily.
        # continue-on-error: a data hiccup must not block the rest of the run;
        # the learner below simply reports insufficient_panel.
        continue-on-error: true
        run: |
          mkdir -p logs
          python -m scripts.build_panel --refresh --lookback 1000 2>&1 \
            | tee logs/panel_build_latest.txt

      - name: Panel learning loop — analyze & propose (no change applied)
        # Writes logs/learning_proposal_panel.json. Does NOT apply.
        if: always()
        run: |
          echo "## Panel Learning Loop — Weight & Threshold Proposal" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m scripts.learn_panel 2>&1 \
            | tee logs/learning_proposal_panel_latest.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit panel proposal
        # The panel itself is gitignored (tens of MB, reproducible from market
        # data); only the proposal and its log are versioned.
        if: always()
        run: |
          git config user.name  "egx-enhancer[bot]"
          git config user.email "egx-enhancer@users.noreply.github.com"
          git add logs/learning_proposal_panel.json \
                  logs/learning_proposal_panel_latest.txt \
                  logs/panel_build_latest.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No panel proposal to commit."
          else
            git commit -m "chore(panel): market-data learning proposal [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Open PR for panel-validated proposal
        # Mirrors the daily loop's gate: branch off main, run `--apply` to write
        # model_params.json, open a PR. Merging is the human approval step —
        # nothing reaches the decision layer until a human merges.
        #
        # NOTE: valuation/quality weights in this proposal are fitted on a
        # fundamentals snapshot that post-dates most panel rows. The PR body
        # carries the look-ahead warning and the price-only reference IC —
        # read that block before merging.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PROP=logs/learning_proposal_panel.json
          if [ ! -f "$PROP" ]; then echo "No proposal file — nothing to open."; exit 0; fi
          STATUS=$(jq -r '.status // "missing"' "$PROP")
          if [ "$STATUS" != "proposal" ]; then
            echo "No actionable proposal (status: $STATUS) — nothing to open."
            exit 0
          fi

          TAG=$(jq -r '.change_tag // "none"' "$PROP")
          BRANCH="auto-learn-panel/${TAG}"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            echo "PR for $BRANCH already open — skipping."; exit 0
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists on remote — skipping."; exit 0
          fi

          git config user.name  "egx-enhancer[bot]"
          git config user.email "egx-enhancer@users.noreply.github.com"
          git checkout -b "$BRANCH"

          python -m scripts.learn_panel --apply

          git add model_params.json
          if git diff --cached --quiet; then
            echo "learn_panel --apply produced no diff — nothing to PR."; exit 0
          fi
          git commit -m "feat(model): apply panel-validated update (${TAG})"
          git push -u origin "$BRANCH"

          jq -r '.pr_body' "$PROP" > /tmp/pr_body.md
          gh pr create \
            --title "$(jq -r '.pr_title' "$PROP")" \
            --body-file /tmp/pr_body.md \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH"
